<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Repro proposed capsule architecture</title><desc id="desc">A proposed flow, not implemented by this design prototype. A scoped capture adapter sends authorized evidence to redaction and review. The reviewed evidence becomes a portable capsule. A runner validates inputs, executes under an isolation policy, and evaluates an assertion. It emits pass, fail, inconclusive, or runner error evidence. The minimizer removes candidate inputs and reruns the assertion, retaining only reductions that preserve the failure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 7 4-7 4" fill="none" stroke="#738198" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="760" fill="#f4f5f7"/>
<g font-family="system-ui,sans-serif" fill="#182331"><text x="48" y="54" font-size="25" font-weight="650">Repro / portable bug capsules</text><text x="48" y="82" font-size="13" fill="#596577">Proposed architecture · original design artifact · not an implementation or security guarantee</text></g>
<g fill="#fff" stroke="#dbe1e8"><rect x="48" y="130" width="310" height="184" rx="9"/><rect x="445" y="130" width="310" height="184" rx="9"/><rect x="842" y="130" width="310" height="184" rx="9"/><rect x="48" y="393" width="310" height="212" rx="9"/><rect x="445" y="393" width="310" height="212" rx="9"/><rect x="842" y="393" width="310" height="212" rx="9"/></g>
<g fill="none" stroke="#738198" stroke-width="1.5" marker-end="url(#arrow)"><path d="M358 217h77"/><path d="M755 217h77"/><path d="M997 314v40H203v29"/><path d="M358 493h77"/><path d="M755 493h77"/><path d="M600 605v52H203v-42"/></g>
<g font-family="system-ui,sans-serif" fill="#182331" font-size="17" font-weight="650"><text x="72" y="171">1. Scoped capture adapter</text><text x="469" y="171">2. Redact &amp; review</text><text x="866" y="171">3. Portable capsule</text><text x="72" y="434">4. Runner boundary</text><text x="469" y="434">5. Assertion &amp; minimizer</text><text x="866" y="434">6. Evidence inspector</text></g>
<g font-family="system-ui,sans-serif" font-size="13" fill="#596577"><text x="72" y="210">Explicit inputs and dependency hooks</text><text x="72" y="238">Request, storage, clock, randomness</text><text x="72" y="274">Never assume complete capture</text><text x="469" y="210">Remove secrets before packaging</text><text x="469" y="238">Review sensitive fixtures and scope</text><text x="469" y="274">Sharing requires a separate decision</text><text x="866" y="210">Manifest + fixtures + assertion</text><text x="866" y="238">Runtime declaration + provenance</text><text x="866" y="274">Inspectable artifact, not a recording</text><text x="72" y="473">Validate manifest and dependencies</text><text x="72" y="501">Constrain network, time, and resources</text><text x="72" y="529">Treat capsule content as untrusted</text><text x="72" y="575">Isolation must be enforced and tested</text><text x="469" y="473">Evaluate an explicit failure predicate</text><text x="469" y="501">Try candidate reductions</text><text x="469" y="529">Retain only failure-preserving inputs</text><text x="469" y="575">Report stop reason; no global minimum</text><text x="866" y="473">Compare baseline and candidate</text><text x="866" y="501">Inspect event and dependency evidence</text><text x="866" y="529">Separate verdicts from harness failures</text></g>
<g font-family="system-ui,sans-serif" font-size="11" font-weight="600"><rect x="866" y="551" width="44" height="25" rx="4" fill="#eaf6ef"/><text x="876" y="568" fill="#176344">Pass</text><rect x="917" y="551" width="39" height="25" rx="4" fill="#fceef0"/><text x="926" y="568" fill="#a12f3d">Fail</text><rect x="963" y="551" width="88" height="25" rx="4" fill="#fff4da"/><text x="972" y="568" fill="#805000">Inconclusive</text><rect x="1058" y="551" width="72" height="25" rx="4" fill="#fceef0"/><text x="1067" y="568" fill="#a12f3d">Run error</text></g>
<g font-family="system-ui,sans-serif" font-size="12" fill="#596577"><rect x="313" y="645" width="206" height="23" fill="#f4f5f7"/><text x="326" y="661">Rerun each candidate reduction</text><text x="48" y="716">Trust boundary: no fixture should leave the local workflow without review and explicit authorization.</text></g>
</svg>
